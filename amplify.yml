version: 1
frontend:
  phases:
    preBuild:
      commands:
        - yarn install --frozen-lockfile
    build:
      commands:
        # Amplify console env vars only exist at build time; persist them so the
        # Next.js server runtime (middleware, API routes) can read them.
        - env | grep -E '^(BACKEND_URL|JWT_COOKIE_NAME|REFRESH_COOKIE_NAME|COOKIE_DOMAIN|NEXT_PUBLIC_)' >> .env.production
        - yarn build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
